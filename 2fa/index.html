<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2FA Auth - Lấy mã 2FA</title><link rel="stylesheet" href="/2fa/style.css"></head>
<body><main class="page" aria-label="Lấy mã xác minh 2FA"><section class="otp-panel">
  <section id="guest" class="result result-main"><div class="result-header"><h1>Kết quả mã xác minh</h1></div><p id="guestState" class="state" aria-live="polite">Đang tải mã…</p><div class="timer-bar" aria-hidden="true"><div id="timerBarFill" class="timer-bar-fill"></div></div><div id="countdown" class="timer timer-big hidden">Còn lại: <span id="timerValue">0</span> s</div><div class="otp-wrapper"><button id="codeBox" class="otp-code otp-code-big hidden" type="button">------</button></div><button id="copyCode" class="copy-code-btn hidden" type="button">Sao chép mã</button><div id="copyToast" class="copy-toast" aria-live="polite">Đã sao chép mã</div><p id="resetWarning" class="hint hidden"><span>Nhấn vào mã hoặc nút sao chép.</span><strong>MÃ SẼ RESET SAU MỖI 30 GIÂY</strong></p></section>
  <section id="admin" class="admin-panel hidden"><header class="admin-head"><div><p class="admin-kicker">QUẢN TRỊ</p><h2>Link 2FA</h2></div><span id="adminToggle" class="admin-identity">Đang kiểm tra phiên…</span></header><div id="login"><div class="admin-grid"><input id="email" class="input" type="email" placeholder="Email admin" autocomplete="username"><input id="password" class="input" type="password" placeholder="Mật khẩu" autocomplete="current-password"></div><button id="loginBtn" class="copy-code-btn" type="button">Đăng nhập</button><p id="loginState" class="state"></p></div><div id="workspace" class="hidden"><div id="adminCreateTools"><h3>Tạo link mới</h3><div class="admin-grid"><input id="secret" class="input" type="text" placeholder="Dán secret Base32" autocomplete="off"><input id="expiry" class="input" type="datetime-local"></div><button id="createBtn" class="copy-code-btn" type="button">Tạo link 2FA</button></div><p id="adminState" class="state"></p><div id="adminSearchTools" class="admin-search"><h3>Tìm link</h3><div class="admin-grid"><input id="search" class="input" type="text" placeholder="ID hoặc URL /2fa?s=..."><button id="searchBtn" class="copy-code-btn secondary" type="button">Tìm link</button></div></div><div id="editor" class="editor hidden"><h3 id="editorTitle">Quản lý link hiện tại</h3><label id="adminLinkUrlField">URL chia sẻ<input id="url" class="input" readonly></label><label>Secret Base32<input id="editSecret" class="input" type="text" autocomplete="off"></label><label>Hạn dùng<input id="editExpiry" class="input" type="datetime-local"></label><p id="linkMeta" class="state"></p><div class="actions"><button id="copyUrl" class="copy-code-btn secondary" type="button">Sao chép URL</button><button id="saveBtn" class="copy-code-btn" type="button">Lưu</button><button id="revokeBtn" class="copy-code-btn danger" type="button">Thu hồi</button><button id="restoreBtn" class="copy-code-btn secondary hidden" type="button">Khôi phục</button><button id="rotateBtn" class="copy-code-btn secondary" type="button">Đổi ID</button></div></div></div></section>
</section></main><div id="confirmModal" class="confirm-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-backdrop" data-confirm-close></div><section class="confirm-card"><h2 id="confirmTitle">Xác nhận thao tác</h2><p id="confirmMessage"></p><div class="confirm-actions"><button id="confirmCancelBtn" class="copy-code-btn secondary" type="button">Hủy</button><button id="confirmAcceptBtn" class="copy-code-btn danger" type="button">Xác nhận</button></div></section></div><script src="/nf/firebase-runtime-config.js"></script><script src="/2fa/app.js" defer></script></body></html>
