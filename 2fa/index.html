<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mã xác thực 2FA</title><link rel="stylesheet" href="/2fa/style.css"></head>
<body><main class="shell"><section id="guest" class="card"><p class="eyebrow">XÁC THỰC HAI LỚP</p><h1>Mã 2FA của bạn</h1><p id="guestState" class="state">Đang tải mã…</p><div id="codeBox" class="code hidden" aria-live="polite">------</div><p id="countdown" class="countdown hidden"></p><p id="resetWarning" class="warning hidden">Mã sẽ tự đổi sau mỗi 30 giây. Hãy dùng mã trước khi hết thời gian.</p><button id="copyCode" class="button hidden" type="button">Sao chép mã</button></section>
<section id="admin" class="card admin"><div class="admin-head"><div><p class="eyebrow">QUẢN TRỊ</p><h2>Link 2FA</h2></div><button id="adminToggle" class="text-button" type="button">Đăng nhập admin</button></div><div id="login"><input id="email" type="email" placeholder="Email admin" autocomplete="username"><input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password"><button id="loginBtn" class="button" type="button">Đăng nhập</button><p id="loginState" class="state"></p></div><div id="workspace" class="hidden"><div class="grid"><input id="secret" type="text" placeholder="Base32 secret" autocomplete="off"><input id="expiry" type="datetime-local"></div><button id="createBtn" class="button" type="button">Tạo link 2FA</button><p id="adminState" class="state"></p><hr><div class="grid"><input id="search" type="text" placeholder="ID hoặc URL /2fa?s=..."><button id="searchBtn" class="button secondary" type="button">Tìm link</button></div><div id="editor" class="hidden"><label>URL chia sẻ<input id="url" readonly></label><label>Secret Base32<input id="editSecret" type="text" autocomplete="off"></label><label>Hạn dùng<input id="editExpiry" type="datetime-local"></label><p id="linkMeta" class="state"></p><div class="actions"><button id="copyUrl" class="button secondary" type="button">Sao chép URL</button><button id="saveBtn" class="button" type="button">Lưu</button><button id="revokeBtn" class="button danger" type="button">Thu hồi</button><button id="restoreBtn" class="button secondary hidden" type="button">Khôi phục</button><button id="rotateBtn" class="button secondary" type="button">Đổi ID</button></div></div></div></section></main><script src="/nf/firebase-runtime-config.js"></script><script src="/2fa/app.js" defer></script></body></html>
