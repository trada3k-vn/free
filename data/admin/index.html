<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị Data</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/data/style.css"></head><body><main class="shell"><div class="admin-nav"><div><div class="eyebrow">TRÀ ĐÁ 3K</div><h1 class="title">Quản trị Data</h1></div><button id="logout" class="btn ghost hidden">Đăng xuất</button></div><section id="login" class="card"><h2>Đăng nhập admin</h2><div class="grid"><label class="field"><span class="label">Email</span><input id="email" class="input" type="email"></label><label class="field"><span class="label">Mật khẩu</span><input id="password" class="input" type="password"></label></div><div class="actions"><button id="loginBtn" class="btn">Đăng nhập</button></div><div id="loginState" class="status"></div></section><div id="workspace" class="hidden"><section class="card"><div class="admin-nav"><h2>Trang dữ liệu</h2><button id="newPage" class="btn">+ Tạo page</button></div><div class="grid"><label class="field full"><span class="label">Tìm toàn bộ nội dung và note admin</span><input id="search" class="input" placeholder="Nhập từ khoá..."></label></div><div id="searchResults"></div><div id="pages"></div></section><section id="pageEditor" class="card hidden" style="margin-top:16px"><h2 id="pageEditorTitle">Page</h2><div class="grid"><label class="field"><span class="label">Slug</span><input id="pageSlug" class="input"></label><label class="field"><span class="label">Tiêu đề</span><input id="pageTitle" class="input"></label><label class="field full"><span class="label">Link Facebook</span><input id="pageFacebook" class="input" type="url"></label></div><div class="actions"><button id="savePage" class="btn">Lưu page</button><button id="archivePage" class="btn danger">Đưa vào thùng rác</button><button id="closePage" class="btn ghost">Đóng</button></div><div id="pageState" class="status"></div><div id="accountEditor" class="hidden"><hr><h2>Thêm / sửa tài khoản</h2><input id="accountId" type="hidden"><div class="grid"><label class="field"><span class="label">Tiêu đề</span><input id="accountTitle" class="input"></label><label class="field"><span class="label">Ngày hết hạn</span><input id="accountExpiry" class="input" type="datetime-local"></label><label class="field full"><span class="label">Nội dung</span><textarea id="accountContent" rows="5"></textarea></label><label class="field full"><span class="label">Lưu ý</span><textarea id="accountWarning" rows="3"></textarea></label><label class="field"><span class="label">Tag, cách nhau bằng dấu phẩy</span><input id="accountTags" class="input"></label><label class="field"><span class="label">Note admin</span><textarea id="accountNote" rows="3"></textarea></label></div><div class="actions"><button id="saveAccount" class="btn">Lưu tài khoản</button><button id="clearAccount" class="btn ghost">Mục mới</button></div><div id="accountState" class="status"></div><div id="accounts"></div></div></section></div></main><script src="/nf/firebase-runtime-config.js"></script><script type="module" src="/data/admin/admin.js"></script></body></html>
