<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CapCut Account</title><link rel="stylesheet" href="/capcut/styles.css"></head><body>
<main class="shell public-shell"><section class="public-hero"><div class="brand-mark">CC</div><div><div class="eyebrow">TRÀ ĐÁ 3K · CAPCUT</div><h1>Thông tin tài khoản</h1><p id="state" class="muted">Đang tải link...</p></div></section>
<section id="accountCard" class="card hidden"><div class="status-line"><span class="info-label">Trạng thái tài khoản</span><span id="status" class="badge">Đang tải...</span></div><div class="credential-list"><div class="credential"><span class="info-label">Tài khoản</span><div class="copy-row"><input id="username" class="input" readonly><button data-copy="username" class="button button-secondary" type="button">Copy</button></div></div><div class="credential"><span class="info-label">Mật khẩu</span><div class="copy-row"><input id="password" class="input" readonly><button data-copy="password" class="button button-secondary" type="button">Copy</button></div></div></div><div id="warrantyProgress" class="progress-panel hidden" aria-live="polite"><div class="progress-head"><span id="warrantyProgressTitle">Đang kiểm tra tài khoản...</span><span class="spinner"></span></div><div class="progress-track"><div class="progress-bar"></div></div><p id="warrantyProgressDetail">Đang kết nối Google Sheet, vui lòng chờ.</p></div><button id="warrantyBtn" class="button button-primary button-large" type="button">BẢO HÀNH TỰ ĐỘNG</button><p id="actionState" class="notice-text"></p></section>
<section id="emptyCard" class="card empty-card hidden"><div class="empty-icon">✓</div><h2 id="emptyTitle">Chưa có tài khoản</h2><p id="emptyMessage" class="muted">Vui lòng chờ admin cấp tài khoản cho link này.</p></section></main><div id="notice" class="modal hidden"><div class="modal-box"><button id="closeNotice" class="close" type="button" aria-label="Đóng">×</button><div class="modal-icon">!</div><h2>Lưu ý</h2><p id="noticeText"></p><button id="noticeOk" class="button button-primary" type="button">Đã hiểu</button></div></div><script src="/capcut/app.js" defer></script></body></html>
