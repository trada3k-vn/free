<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CapCut Account</title><link rel="stylesheet" href="/capcut/styles.css">
</head>
<body>
  <main class="shell">
    <section class="card hero"><div class="eyebrow">TRÀ ĐÁ 3K · CAPCUT</div><h1>Thông tin tài khoản</h1><p id="state" class="muted">Đang tải link...</p></section>
    <section id="accountCard" class="card hidden">
      <div class="status-row"><span>Trạng thái</span><strong id="status">Đang tải...</strong></div>
      <div class="field"><label>Tài khoản</label><div class="copy-row"><input id="username" readonly><button data-copy="username">Copy</button></div></div>
      <div class="field"><label>Mật khẩu</label><div class="copy-row"><input id="password" readonly><button data-copy="password">Copy</button></div></div>
      <button id="warrantyBtn" class="primary">BẢO HÀNH TỰ ĐỘNG</button>
      <p id="actionState" class="status"></p>
    </section>
    <section id="emptyCard" class="card hidden"><h2>Chưa có tài khoản</h2><p>Vui lòng chờ admin cấp tài khoản cho link này.</p></section>
  </main>
  <div id="notice" class="modal hidden"><div class="modal-box"><button id="closeNotice" class="close">×</button><h2>Lưu ý</h2><p id="noticeText"></p><button id="noticeOk" class="primary">Đã hiểu</button></div></div>
  <script src="/capcut/app.js" defer></script>
</body>
</html>
