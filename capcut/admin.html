<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị CapCut</title><link rel="stylesheet" href="/capcut/styles.css"></head>
<body><main class="shell"><section id="loginCard" class="card"><div class="eyebrow">TRÀ ĐÁ 3K · ADMIN CAPCUT</div><h1>Đăng nhập admin</h1><div class="field"><label>Email</label><input id="email" class="copy-row input" type="email"></div><div class="field"><label>Mật khẩu</label><input id="password" class="copy-row input" type="password"></div><button id="login" class="primary">ĐĂNG NHẬP</button><p id="loginState" class="status"></p></section>
<section id="workspace" class="hidden"><section class="card"><div class="eyebrow">TẠO LINK</div><h1>CapCut</h1><div class="field"><label>Số ngày hạn link</label><input id="days" class="input" type="number" min="1" value="30"></div><button id="create" class="primary">TẠO LINK CAPCUT</button><p id="createState" class="status"></p><div id="created" class="hidden"><label>Link vừa tạo</label><div class="copy-row"><input id="linkOutput" readonly><button id="copyLink">Copy</button></div><button id="assign" class="primary">NHẬP TÀI KHOẢN TỰ ĐỘNG</button><pre id="result"></pre></div></section>
<section class="card"><div class="eyebrow">CÀI ĐẶT</div><h2>Popup lưu ý</h2><div class="field"><textarea id="popup" rows="5" class="input"></textarea></div><div class="field"><label>Thông báo khi tài khoản còn hạn</label><input id="warrantyMessage" class="input"></div><div class="field"><label>Apps Script URL riêng cho CapCut</label><input id="sheetUrl" class="input" placeholder="https://script.google.com/macros/s/.../exec"></div><button id="saveConfig" class="primary">LƯU CÀI ĐẶT</button><p id="configState" class="status"></p></section></section></main><script src="/nf/firebase-runtime-config.js"></script><script type="module" src="/capcut/admin.js"></script></body></html>
